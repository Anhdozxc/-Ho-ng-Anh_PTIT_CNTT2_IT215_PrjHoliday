<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Lỗi hệ thống - Holiday Planner</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<main class="error-shell">
    <section class="card hp-card error-card page-enter" aria-labelledby="errorTitle">
        <img class="error-illustration" th:src="@{/images/destinations/phu-quoc.svg}"
             data-fallback="/images/destination-fallback.svg" alt="Đường chân trời Phú Quốc">
        <div class="error-code" aria-hidden="true">500</div>
        <p class="eyebrow">Tạm dừng ngắn</p>
        <h1 id="errorTitle" class="h2">Có lỗi ngoài dự kiến</h1>
        <p class="text-secondary">Vui lòng thử lại sau ít phút. Chi tiết kỹ thuật được ẩn để bảo vệ dữ liệu của bạn.</p>
        <a class="btn btn-primary" th:href="@{/dashboard}">Về trang tổng quan</a>
    </section>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
