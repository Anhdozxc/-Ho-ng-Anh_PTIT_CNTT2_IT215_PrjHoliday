spring.application.name=holiday-planner
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/holiday_planner?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.security.remember-me-key=${REMEMBER_ME_KEY:${random.uuid}}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.media.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.media.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.media.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.media.cloudinary.folder=${CLOUDINARY_FOLDER:holiday-planner}
app.seed-demo-data=${APP_SEED_DEMO_DATA:true}
