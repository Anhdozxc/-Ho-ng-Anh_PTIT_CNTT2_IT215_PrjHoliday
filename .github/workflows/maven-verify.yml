name: Maven Verify

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: HolidayPlanner

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run clean tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Build executable package
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: HolidayPlanner/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
